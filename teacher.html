<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>던전 대시 - 교사 플랫폼</title>
  <link rel="stylesheet" href="css/teacher.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="body-text">던전 대시</span>
      <nav class="menu" id="menu" hidden>
        <button class="menu-item" type="button" data-view="classes">학급</button>
        <button class="menu-item" type="button" data-view="bank">문제은행</button>
      </nav>
    </div>
    <div class="topbar-right" id="account" hidden>
      <span class="small-text" id="teacher-name"></span>
      <button class="btn" id="logout-btn">로그아웃</button>
    </div>
  </header>

  <main>
    <section id="login-view" class="center">
      <h1 class="big-text">던전 대시</h1>
      <p class="small-text">DUNGEON DASH · 교사 플랫폼</p>
      <button class="btn primary" id="login-btn">Google로 로그인</button>
      <p class="small-text error" id="error"></p>
    </section>

    <section id="home-view" hidden>
      <p class="body-text" id="welcome"></p>

      <div class="page-head">
        <h2 class="body-text">학급</h2>
        <span class="small-text notice" id="class-notice"></span>
      </div>

      <form id="class-form" class="form-row" novalidate>
        <label class="field">
          <span class="small-text">학급 이름</span>
          <input class="input" id="class-name" type="text" autocomplete="off">
        </label>
        <button class="btn primary" id="class-create-btn" type="submit">학급 만들기</button>
      </form>
      <p class="small-text error" id="class-error"></p>

      <div id="class-created" hidden>
        <p class="small-text" id="class-created-name"></p>
        <p class="big-text" id="class-code"></p>
      </div>

      <div id="class-list"></div>
    </section>

    <section id="class-view" hidden>
      <div class="page-head">
        <button class="btn" id="class-back-btn" type="button">학급 목록으로</button>
      </div>
      <div class="name-row">
        <h2 class="body-text" id="detail-name"></h2>
        <span class="small-text notice" id="detail-notice"></span>
      </div>
      <button class="btn" id="rename-btn" type="button">이름 바꾸기</button>
      <form id="rename-form" class="form-row" novalidate hidden>
        <label class="field">
          <span class="small-text">새 학급 이름</span>
          <input class="input" id="rename-input" type="text" autocomplete="off">
        </label>
        <button class="btn primary" id="rename-save-btn" type="submit">저장</button>
        <button class="btn" id="rename-cancel-btn" type="button">취소</button>
      </form>
      <p class="small-text error" id="rename-error"></p>
      <p class="small-text detail-label">참여 코드</p>
      <p class="big-text" id="detail-code"></p>

      <nav class="tabs">
        <button class="tab" type="button" data-tab="students">학생</button>
        <button class="tab" type="button" data-tab="activities">활동</button>
        <button class="tab" type="button" data-tab="results">결과</button>
      </nav>
      <div class="tab-panel" data-panel="students">
        <p class="small-text muted">참여한 학생 목록은 6단계(학생 참여)에서 만들어요.</p>
      </div>
      <div class="tab-panel" data-panel="activities" hidden>
        <p class="small-text muted">학습 활동은 5단계(수업 활동 관리)에서 만들어요.</p>
      </div>
      <div class="tab-panel" data-panel="results" hidden>
        <p class="small-text muted">결과 조회는 8단계(결과 분석)에서 만들어요.</p>
      </div>
    </section>

    <section id="bank-view" hidden>
      <div class="page-head">
        <h2 class="body-text">문제은행</h2>
      </div>
      <p class="small-text muted">문제은행은 4단계에서 만들어요.</p>
    </section>
  </main>

  <script type="module" src="js/teacher/main.js"></script>
</body>
</html>
