<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>던전 대시 - 교사 플랫폼</title>
  <link rel="stylesheet" href="css/teacher.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="body-text">던전 대시</span>
      <nav class="menu" id="menu" hidden>
        <button class="menu-item" type="button" data-view="classes">학급</button>
        <button class="menu-item" type="button" data-view="bank">문제은행</button>
      </nav>
    </div>
    <div class="topbar-right" id="account" hidden>
      <span class="small-text" id="teacher-name"></span>
      <button class="btn" id="logout-btn">로그아웃</button>
    </div>
  </header>

  <main>
    <section id="login-view" class="center">
      <h1 class="big-text">던전 대시</h1>
      <p class="small-text">DUNGEON DASH · 교사 플랫폼</p>
      <button class="btn primary" id="login-btn">Google로 로그인</button>
      <p class="small-text error" id="error"></p>
    </section>

    <section id="home-view" hidden>
      <p class="body-text" id="welcome"></p>

      <div class="page-head">
        <h2 class="body-text">학급</h2>
        <span class="small-text notice" id="class-notice"></span>
      </div>

      <form id="class-form" class="form-row" novalidate>
        <label class="field">
          <span class="small-text">학급 이름</span>
          <input class="input" id="class-name" type="text" autocomplete="off">
        </label>
        <button class="btn primary" id="class-create-btn" type="submit">학급 만들기</button>
      </form>
      <p class="small-text error" id="class-error"></p>

      <div id="class-created" hidden>
        <p class="small-text" id="class-created-name"></p>
        <p class="big-text" id="class-code"></p>
      </div>

      <div id="class-list"></div>
    </section>

    <section id="class-view" hidden>
      <div class="page-head">
        <button class="btn" id="class-back-btn" type="button">학급 목록으로</button>
      </div>
      <div class="name-row">
        <h2 class="body-text" id="detail-name"></h2>
        <span class="small-text notice" id="detail-notice"></span>
      </div>
      <button class="btn" id="rename-btn" type="button">이름 바꾸기</button>
      <form id="rename-form" class="form-row" novalidate hidden>
        <label class="field">
          <span class="small-text">새 학급 이름</span>
          <input class="input" id="rename-input" type="text" autocomplete="off">
        </label>
        <button class="btn primary" id="rename-save-btn" type="submit">저장</button>
        <button class="btn" id="rename-cancel-btn" type="button">취소</button>
      </form>
      <p class="small-text error" id="rename-error"></p>
      <p class="small-text detail-label">참여 코드</p>
      <p class="big-text" id="detail-code"></p>

      <nav class="tabs">
        <button class="tab" type="button" data-tab="students">학생</button>
        <button class="tab" type="button" data-tab="activities">활동</button>
        <button class="tab" type="button" data-tab="results">결과</button>
      </nav>
      <div class="tab-panel" data-panel="students">
        <p class="small-text muted">참여한 학생 목록은 6단계(학생 참여)에서 만들어요.</p>
      </div>
      <div class="tab-panel" data-panel="activities" hidden>
        <p class="small-text muted">학습 활동은 5단계(수업 활동 관리)에서 만들어요.</p>
      </div>
      <div class="tab-panel" data-panel="results" hidden>
        <p class="small-text muted">결과 조회는 8단계(결과 분석)에서 만들어요.</p>
      </div>
    </section>

    <section id="bank-view" hidden>
      <div class="page-head">
        <h2 class="body-text">문제은행</h2>
        <span class="small-text notice" id="bank-notice"></span>
        <div class="head-buttons">
          <button class="btn primary" id="q-add-btn" type="button">문제 추가</button>
          <button class="btn" id="q-import-btn" type="button">기본 문제 불러오기</button>
        </div>
      </div>

      <form id="q-form" class="q-form" novalidate hidden>
        <p class="body-text" id="q-form-title">문제 추가</p>
        <div class="form-row">
          <label class="field">
            <span class="small-text">과목</span>
            <select class="input" id="q-subject"></select>
            <span class="small-text error" data-error="subject"></span>
          </label>
          <label class="field">
            <span class="small-text">난이도</span>
            <select class="input" id="q-difficulty"></select>
            <span class="small-text error" data-error="difficulty"></span>
          </label>
        </div>
        <p class="small-text muted" id="q-hint"></p>
        <div class="form-row">
          <label class="field">
            <span class="small-text">학습 개념</span>
            <select class="input" id="q-concept"></select>
          </label>
          <label class="field" id="q-new-concept-field" hidden>
            <span class="small-text">새 개념</span>
            <input class="input" id="q-new-concept" type="text" autocomplete="off" placeholder="예: 일차방정식">
          </label>
        </div>
        <p class="small-text error" data-error="learningConcept"></p>
        <label class="field">
          <span class="small-text">문제</span>
          <input class="input" id="q-question" type="text" autocomplete="off">
          <span class="small-text error" data-error="question"></span>
        </label>
        <fieldset class="choices">
          <legend class="small-text">보기 4개 — 정답 보기 앞의 동그라미를 고르세요</legend>
          <div class="choice-row"><input type="radio" name="q-answer" value="0" aria-label="보기 1을 정답으로"><input class="input" data-choice="0" type="text" autocomplete="off" placeholder="보기 1"></div>
          <div class="choice-row"><input type="radio" name="q-answer" value="1" aria-label="보기 2를 정답으로"><input class="input" data-choice="1" type="text" autocomplete="off" placeholder="보기 2"></div>
          <div class="choice-row"><input type="radio" name="q-answer" value="2" aria-label="보기 3을 정답으로"><input class="input" data-choice="2" type="text" autocomplete="off" placeholder="보기 3"></div>
          <div class="choice-row"><input type="radio" name="q-answer" value="3" aria-label="보기 4를 정답으로"><input class="input" data-choice="3" type="text" autocomplete="off" placeholder="보기 4"></div>
          <p class="small-text error" data-error="choices"></p>
          <p class="small-text error" data-error="answer"></p>
        </fieldset>
        <p class="small-text error" id="q-save-error"></p>
        <div class="button-row">
          <button class="btn primary" id="q-save-btn" type="submit">저장</button>
          <button class="btn" id="q-cancel-btn" type="button">취소</button>
        </div>
      </form>

      <div class="filter-row">
        <label class="field">
          <span class="small-text">과목</span>
          <select class="input" id="f-subject"></select>
        </label>
        <label class="field">
          <span class="small-text">난이도</span>
          <select class="input" id="f-difficulty"></select>
        </label>
        <label class="field">
          <span class="small-text">학습 개념</span>
          <select class="input" id="f-concept"></select>
        </label>
        <label class="field search-field">
          <span class="small-text">문제 내용 검색</span>
          <input class="input" id="f-keyword" type="search" autocomplete="off" placeholder="문제 글로 찾기">
        </label>
      </div>
      <p class="small-text error" id="bank-error"></p>
      <div id="q-list"></div>
    </section>
  </main>

  <div class="overlay" id="confirm" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <p class="body-text" id="confirm-text"></p>
      <div class="button-row">
        <button class="btn" id="confirm-cancel" type="button">취소</button>
        <button class="btn danger" id="confirm-ok" type="button">삭제</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/teacher/main.js"></script>
</body>
</html>
