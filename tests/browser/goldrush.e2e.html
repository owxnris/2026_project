<!doctype html><html lang="ko"><head><meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "http://127.0.0.1:5599/js/firebase/sdk.js": "/__test/e2e-sdk.js",
  "http://127.0.0.1:5599/js/firebase/app.js": "/__test/e2e-app.js"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>html,body{margin:0;background:#1B1F2A}#game{width:960px;height:540px}</style></head>
<body><div id="game"></div><pre id="out">running</pre>
<script type="module">
// 골드 러시: 교사가 만든 골드 러시 활동을 시작 → 학생 대기 화면이 이벤트 화면으로 → 참여 → 정답마다 골드 → 실시간 현황(실제 진행 상황 문서) → 종료 → 요약·결과 저장
var out = []; window.addEventListener('error', (e) => out.push('WINERR ' + e.message + ' @' + e.filename + ':' + e.lineno)); window.addEventListener('unhandledrejection', (e) => out.push('REJ ' + (e.reason?.stack || e.reason)));
const log = (ok, msg) => out.push((ok ? 'PASS ' : 'FAIL ') + msg);
const tick = (ms = 50) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, ms = 6000) { const t = Date.now(); while (Date.now() - t < ms) { try { if (fn()) return true; } catch {} await tick(30); } return false; }
try {
  const F = await import('/__test/e2e-sdk.js');
  const T = await import('/js/teacher/activities.js');
  const put = (p, v) => F.docs.set(p, v);
  const QS = [
    { id: 'q1', subject: '수학', difficulty: '하', learningConcept: '곱셈', question: '2×3', choices: ['5', '6', '7', '8'] },
    { id: 'q2', subject: '과학', difficulty: '하', learningConcept: '광합성', question: '광합성 장소', choices: ['뿌리', '잎', '줄기', '꽃'] },
  ];
  const KEY = { q1: 1, q2: 1 };
  put('classes/C1', { ownerUid: 'T1', name: '1반', joinCode: '123456' });
  put('joinCodes/123456', { classId: 'C1', ownerUid: 'T1' });
  // 교사 코드로 골드 러시 활동 만들기
  const gid = await T.createActivity('C1', { title: '구구단 대결', totalTimeSec: 300, picked: QS.map((q) => ({ ...q, answer: KEY[q.id] })), mode: 'goldrush' });
  log(F.docs.get(`classes/C1/activities/${gid}`).mode === 'goldrush', 'teacher creates gold rush activity (mode saved)');

  const { COLORS, LAYOUT, PHYS } = await import('/js/config.js');
  const scenes = await Promise.all(['Boot', 'Start', 'Join', 'Waiting', 'WorldMap', 'Quiz', 'Shop', 'Dungeon', 'Result', 'GoldRush'].map((n) => import(`/js/scenes/${n}Scene.js`).then((m) => m.default)));
  const { state } = await import('/js/state.js');
  const { session } = await import('/js/session.js');
  const game = new Phaser.Game({ type: Phaser.CANVAS, parent: 'game', width: LAYOUT.W, height: LAYOUT.H, backgroundColor: COLORS.bg,
    fps: { forceSetTimeOut: true, target: 60 }, dom: { createContainer: true }, physics: { default: 'arcade', arcade: { gravity: { y: PHYS.GRAVITY } } }, scene: scenes });
  const active = (k) => game.scene.isActive(k); const S = (k) => game.scene.getScene(k); const Q = () => S('Quiz');
  const prog = () => F.docs.get(`classes/C1/activities/${gid}/progress/S1`);
  const texts = (k) => S(k).children.list.map((c) => c.text || '').join('\n');

  await waitFor(() => active('Start'));
  S('Start').scene.start('Join'); await waitFor(() => active('Join'));
  S('Join').code.el.value = '123456'; S('Join').nick.el.value = '하늘'; S('Join').submit();
  log(await waitFor(() => active('Waiting')), 'student waiting');
  await T.startActivity('C1', gid);
  log(await waitFor(() => active('GoldRush')), 'teacher starts gold rush -> student sees event screen (not the map)');
  log(session.mode === 'goldrush', 'session mode goldrush');
  log(await waitFor(() => texts('GoldRush').includes('참가 1명')), `live board counts the real participant (${texts('GoldRush').split('\n').find((t) => t.startsWith('참가'))})`);
  log(texts('GoldRush').includes('남은 시간'), 'countdown shown');

  // 참여하기 → 문제 풀기: 정답 2개, 오답 1개
  S('GoldRush').scene.start('Quiz', { mode: 'rush' });
  for (let i = 0; i < 3; i++) {
    await waitFor(() => active('Quiz') && Q().item && !Q().answered && Q().count === i);
    const k = KEY[Q().item.question.id];
    Q().answer(i < 2 ? k : (k + 1) % 4);
    await waitFor(() => Q().count === i + 1, 3000);
  }
  log(state.coins === 20, `gold from correct answers (${state.coins})`);
  log(await waitFor(() => prog()?.coins === 20, 6000), 'progress doc holds event gold (teacher & classmates see it)');
  log(Q().count === 3 && !!Q().item, 'questions keep coming (no 3-question limit)');

  // 다른 학생이 실제로 참가한 것처럼 진행 상황 문서 추가 → 실시간 순위
  F.setDoc({ path: `classes/C1/activities/${gid}/progress/S9` }, { nickname: '바다', currentDungeon: null, clearedCount: 0, coins: 50, updatedAt: F.serverTimestamp() });
  log(await waitFor(() => Q().rushInfo.text.includes('내 순위 2위') && Q().rushInfo.text.includes('참가 2명') && Q().rushInfo.text.includes('총 골드 70')), `live rank in quiz (${Q().rushInfo.text})`);

  // 교사 종료 → 요약·결과 저장(outcome goldrush, 문제 기록)
  await T.endActivity('C1', gid);
  log(await waitFor(() => active('Result')), 'teacher end -> result');
  log(await waitFor(() => texts('Result').includes('선생님이 골드 러시를 끝냈어요') && texts('Result').includes('20 골드') && texts('Result').includes('참가 2명')), 'gold rush summary: my gold, participants');
  log(texts('Result').includes('1위  바다  50 골드') && texts('Result').includes('2위  하늘  20 골드'), 'summary leaderboard from real data');
  const res = await (async () => { await waitFor(() => [...F.docs].some(([p, v]) => p.startsWith('classes/C1/results/') && v.outcome === 'goldrush')); return [...F.docs].find(([p, v]) => p.startsWith('classes/C1/results/') && v.outcome === 'goldrush')?.[1]; })();
  log(res && res.quizCorrect === 2 && res.coinsEarned === 20 && res.hits === null && res.activityId === gid && res.answers.every((a) => a.quizType === 'rush'), 'result saved as goldrush with quiz record (for analysis)');
  const adv = F.docs.get('classes/C1/adventure/S1');
  log(adv && adv.gold === 20, 'event gold added to adventure gold');
} catch (e) { out.push('ERROR ' + e.stack); }
document.getElementById('out').textContent = out.join('\n');
</script></body></html>
