<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>던전 대시 - DUNGEON DASH</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1B1F2A; }
    #game { width: 100%; height: 100%; }
  </style>
  <script>
    // 체험 모드: ?demo=1로 들어오면 이 브라우저는 체험 모드 — 실제 Firebase 대신 js/demo/sdk.js(이 브라우저 안의 저장소)를 쓴다.
    // 이 탭에서만 체험 모드다(sessionStorage) — 탭·브라우저를 닫거나 '체험 끝내기'·?demo=0이면 실제 서비스. 게임·교사 코드는 그대로이고 불러오는 파일만 바꾼다 (import map)
    (function () {
      var q = new URLSearchParams(location.search), on = false;
      try {
        localStorage.removeItem('dd.demo'); // 예전 방식(브라우저에 계속 남던 표시) 지우기
        if (q.get('demo') === '1') sessionStorage.setItem('dd.demo', '1');
        if (q.get('demo') === '0') sessionStorage.removeItem('dd.demo');
        on = sessionStorage.getItem('dd.demo') === '1';
      } catch (e) { on = q.get('demo') === '1'; }
      if (!on) return;
      var base = new URL('js/', document.baseURI).href, map = {};
      map[base + 'firebase/sdk.js'] = base + 'demo/sdk.js';
      var m = document.createElement('script');
      m.type = 'importmap';
      m.textContent = JSON.stringify({ imports: map });
      document.currentScript.after(m);
      var b = document.createElement('script');
      b.type = 'module';
      b.src = 'js/demo/banner.js';
      m.after(b);
    })();
  </script>
  <!-- 원스토어 H5 게임 SDK (spec.md 출시): 게임 코드·Phaser보다 먼저 불러온다. 일반 브라우저에서는 아무 일도 하지 않고,
       못 불러와도(학교망 차단 등) 게임은 그대로 시작한다. 연동 코드는 js/onestore.js -->
  <script type="module">
    import { createSDK } from 'https://h5sdk.onestore.net/lib/v1.2.0/onestore-h5-sdk.min.js';
    createSDK();
  </script>
  <!-- 픽셀 글꼴 Galmuri (SIL OFL 1.1, assets/CREDITS.md) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <!-- defer: SDK(위 module) 다음, 게임(js/main.js) 전에 실행 -->
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
